__merge__: /src/api/comp_atac_method.yaml
name: svd
label: TF-IDF+SVD
summary: foo
description: foo
references:
  doi: 10.48550/arXiv.1201.0490
links:
  repository: https://github.com/scikit-learn/scikit-learn/
  documentation: https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.TruncatedSVD.html
info:
  method_types: [embedding]
  preferred_normalization: log_cp10k
arguments:
  - name: --harmony
    type: boolean
    default: false
    description: Run harmony?
  - name: --br_mode
    type: integer
    default: 0
    description: 0-> none, >0 -> select that many, -1 -> scale, -2 -> center
resources:
  - type: python_script
    path: script.py
  - path: /src/utils/read_anndata_partial.py
engines:
  - type: docker
    image: openproblems/base_python:1
    setup:
      - type: python
        pypi:
          - harmonypy==2.0.0
          - scib==1.1.7          
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midcpu, highmem, lowtime]
